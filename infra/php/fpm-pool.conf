; PHP-FPM pool sizing.
;
; The image ships pm.max_children = 5, which caps the shop at roughly 15 requests
; per second regardless of how much hardware is underneath it — measured, not
; assumed: throughput plateaued at 15 rps while latency rose linearly with
; concurrency, which is what a saturated fixed worker pool looks like.
;
; Sizing reasoning, so this can be revisited rather than cargo-culted:
;
;   * A WooCommerce worker uses roughly 60–80 MB. 40 children is ~3 GB worst case
;     against ~6.8 GB free with the shop, database, Redis and mail server running.
;   * More children than vCPUs is correct HERE because our workers spend most of
;     their time BLOCKED ON I/O, not on CPU: every shipping calculation calls the
;     panel API (up to an 8s timeout) and the database. A CPU-bound app would want
;     roughly one worker per core; we want enough to cover the waiting.
;   * max_requests recycles workers to bound any slow leak in a long-running
;     plugin, which is cheaper than diagnosing one in production.
;
; Revisit after the catalogue import — that is the load this has not yet seen.

[www]
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 500

; Surface saturation instead of leaving it to be inferred from slow pages.
pm.status_path = /fpm-status
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 300s
