# Persistent bans for anything tripping nginx's rate limits.
#
# Uses fail2ban's SHIPPED nginx-limit-req filter rather than a hand-written
# regex against the access log. A hand-rolled version failed silently: fail2ban
# strips the timestamp before matching, so a regex written against the raw log
# format matches nothing while the jail still loads and reports "0 failed" —
# indistinguishable from "no attacks yet".
#
# The error log is the right source: nginx records every limit_req rejection
# there with the client IP and the zone name.
[nginx-limit-req]
enabled  = true
# This box defaults to the systemd backend, which silently ignores logpath and
# watches the journal instead — the jail loads and never sees the file.
backend  = polling
logpath  = /srv/darling/prod/nginx/logs/error.log
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1
