name: darling

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=2G
      --innodb-log-file-size=512M
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --max-connections=120
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    # NO ports: — internal only. Docker publishes bypass ufw (learned on the panel box).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - ./redis:/data

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    getenv('WP_HOME'));
        define('WP_SITEURL', getenv('WP_SITEURL'));
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      # SMTP. The image has no MTA, so without these WordPress sends nothing at
      # all — and fails quietly, as an order note rather than an error.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Дарлинг}
      DARLING_PANEL_URL: ${DARLING_PANEL_URL}
      DARLING_PANEL_TOKEN: ${DARLING_PANEL_TOKEN}
    volumes:
      - ./wordpress:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-darling.ini:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./wordpress:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./public:/var/www/public:ro

  # ---------------------------------------------------------------------------
  # Mail server for @darlinghome.bg.
  #
  # docker-mailserver rather than hand-rolled Postfix/Dovecot: it bundles Postfix,
  # Dovecot, OpenDKIM, Rspamd and fail2ban with sane defaults. Hand-assembling
  # those is where self-hosted mail usually goes wrong — an accidental open relay
  # gets the IP blocklisted within hours, and then nothing this domain sends
  # reaches anyone.
  #
  # RECEIVING works as soon as DNS points here. SENDING additionally requires
  # Contabo to unblock outbound port 25 — see infra/MAIL.md.
  mailserver:
    image: mailserver/docker-mailserver:14.0
    container_name: darling-mailserver
    hostname: mail.darlinghome.bg
    restart: unless-stopped
    # NET_ADMIN is for fail2ban's iptables rules; SYS_PTRACE for its log parsing.
    cap_add: [NET_ADMIN, SYS_PTRACE]
    ports:
      - "25:25"     # inbound mail from other servers
      - "587:587"   # submission (STARTTLS) - what WordPress will use
      - "465:465"   # submission (implicit TLS)
      - "993:993"   # IMAPS, for reading the mailbox
    environment:
      OVERRIDE_HOSTNAME: mail.darlinghome.bg
      # Reuse the certbot certificates nginx already renews on this box.
      SSL_TYPE: letsencrypt
      ENABLE_OPENDKIM: 1
      ENABLE_OPENDMARC: 1
      ENABLE_RSPAMD: 1
      ENABLE_CLAMAV: 0          # ~1GB RAM; not worth it at this volume
      ENABLE_FAIL2BAN: 1
      # A mail server that accepts mail for anyone is a spam relay. Explicitly off.
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      POSTMASTER_ADDRESS: orders@darlinghome.bg
      LOG_LEVEL: info
    volumes:
      - ./mail/data:/var/mail
      - ./mail/state:/var/mail-state
      - ./mail/logs:/var/log/mail
      - ./mail/config:/tmp/docker-mailserver
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
