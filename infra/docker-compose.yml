name: darling

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=2G
      --innodb-log-file-size=512M
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --max-connections=120
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    # NO ports: — internal only. Docker publishes bypass ufw (learned on the panel box).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - ./redis:/data

  wordpress:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME',    getenv('WP_HOME'));
        define('WP_SITEURL', getenv('WP_SITEURL'));
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('DISABLE_WP_CRON', true);
        define('WP_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      # SMTP. The image has no MTA, so without these WordPress sends nothing at
      # all — and fails quietly, as an order note rather than an error.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Дарлинг}
      DARLING_PANEL_URL: ${DARLING_PANEL_URL}
      DARLING_PANEL_TOKEN: ${DARLING_PANEL_TOKEN}
    volumes:
      - ./wordpress:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-darling.ini:ro
      - ./php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-darling.conf:ro

  # WP-Cron, which WordPress cannot run for itself here.
  #
  # DISABLE_WP_CRON above is right: the scheduler WordPress ships with fires on random page
  # loads, so "in 960 seconds" really means "whenever somebody next visits". But turning it off
  # is only half a change, and for a long time nothing did the other half - so every
  # wp_schedule_single_event() in the plugin was queued and never run.
  #
  # The one that costs money is the BORICA recheck. A card transaction that comes back
  # non-final is provisional until GUARDTIME passes; the callback puts the order ON HOLD and
  # re-queries with TRTYPE=90 at +960s. With no runner that query never happens - the order
  # sits on hold forever while the card may well have been charged, and nothing goes red. It
  # looks exactly like an order nobody has got round to yet.
  #
  # A container rather than a host crontab, because this file is what a rebuild carries; a line
  # typed on the box once is invisible and is lost the day the box is rebuilt. CLI rather than
  # a curl to wp-cron.php, because HTTP would drag in the rate limits in 00-limits.conf, the
  # staging basic-auth gate, and a dependency on the site being reachable from inside its own
  # network - all for a call that never needed to leave the host.
  wpcron:
    image: wordpress:php8.3-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    # The image's entrypoint installs and rewrites WordPress on the volume it is handed. This
    # container must only ever READ that volume, so the entrypoint is replaced outright, and it
    # runs as the same user php-fpm does so it cannot leave root-owned files behind.
    user: www-data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php /var/www/html/wp-cron.php >/dev/null 2>&1 \
            || echo "wp-cron: run exited $$? (watch cron_late_min in health.json)" >&2
          sleep 60
        done
    environment:
      # wp-config.php already sits on the shared volume, but it resolves WP_HOME and WP_SITEURL
      # through getenv() at RUNTIME. Under CLI there is no Host header to fall back on, so
      # without these two every URL WordPress builds inside a scheduled job comes out wrong.
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      # Scheduled work sends mail (order status, recheck outcomes). Without these the image has
      # no MTA and the failure is silent, which is the whole reason they are on wordpress too.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Дарлинг}
      DARLING_PANEL_URL: ${DARLING_PANEL_URL}
      DARLING_PANEL_TOKEN: ${DARLING_PANEL_TOKEN}
    volumes:
      - ./wordpress:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-darling.ini:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./wordpress:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./public:/var/www/public:ro
      - ./nginx/logs:/var/log/nginx-host

  # ---------------------------------------------------------------------------
  # Mail server for @darlinghome.bg.
  #
  # docker-mailserver rather than hand-rolled Postfix/Dovecot: it bundles Postfix,
  # Dovecot, OpenDKIM, Rspamd and fail2ban with sane defaults. Hand-assembling
  # those is where self-hosted mail usually goes wrong — an accidental open relay
  # gets the IP blocklisted within hours, and then nothing this domain sends
  # reaches anyone.
  #
  # Outbound :25 is confirmed open on this box (Gmail answers with a banner), so
  # sending is possible once DNS and the PTR record are in place — see infra/MAIL.md.
  mailserver:
    image: mailserver/docker-mailserver:14.0
    container_name: darling-mailserver
    hostname: mail.darlinghome.bg
    restart: unless-stopped
    # NET_ADMIN is for fail2ban's iptables rules; SYS_PTRACE for its log parsing.
    cap_add: [NET_ADMIN, SYS_PTRACE]
    ports:
      - "25:25"     # inbound mail from other servers
      - "587:587"   # submission (STARTTLS) - what WordPress will use
      - "465:465"   # submission (implicit TLS)
      - "993:993"   # IMAPS, for reading the mailbox
    environment:
      OVERRIDE_HOSTNAME: mail.darlinghome.bg
      # Reuse the certbot certificates nginx already renews on this box.
      SSL_TYPE: letsencrypt
      ENABLE_OPENDKIM: 1
      ENABLE_OPENDMARC: 1
      # Rspamd OFF, deliberately. With both it and OpenDKIM enabled the container
      # warns about "conflicting DKIM support" and then leaves /etc/opendkim/*
      # EMPTY — KeyTable, SigningTable and TrustedHosts all zero bytes — so nothing
      # is ever signed. Outbound mail was leaving unsigned and would have failed
      # DKIM at every receiver, while the startup log looked like a warning rather
      # than a breakage. One DKIM stack only; OpenDKIM keeps the key already
      # published in DNS.
      ENABLE_RSPAMD: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_POSTGREY: 1
      ENABLE_CLAMAV: 0          # ~1GB RAM; not worth it at this volume
      ENABLE_FAIL2BAN: 1
      # A mail server that accepts mail for anyone is a spam relay. Explicitly off.
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      POSTMASTER_ADDRESS: orders@darlinghome.bg
      LOG_LEVEL: info
    volumes:
      - ./mail/data:/var/mail
      - ./mail/state:/var/mail-state
      - ./mail/logs:/var/log/mail
      - ./mail/config:/tmp/docker-mailserver
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      default:
        aliases:
          # So WordPress can reach it as mail.darlinghome.bg from inside Docker.
          # Connecting by container name would present a certificate for
          # mail.darlinghome.bg against a host called "mailserver" and fail
          # verification — and the tempting fix (disable cert checking on the
          # internal hop) trains us to ignore exactly the error that matters.
          - mail.darlinghome.bg

  # Webmail at https://mail.darlinghome.bg.
  #
  # Talks to the mail container over the network alias so the TLS certificate name
  # matches, exactly as WordPress does. SQLite for its own state — it stores
  # preferences and an address book, not mail, so it does not warrant a database
  # alongside the shop's.
  roundcube:
    image: roundcube/roundcubemail:1.6.x-apache
    container_name: darling-roundcube
    restart: unless-stopped
    depends_on: [mailserver]
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.darlinghome.bg
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.darlinghome.bg
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - ./mail/roundcube/db:/var/roundcube/db
      - ./mail/roundcube/config:/var/roundcube/config
      # Roundcube must trust the same CA chain to verify the mail server's cert.
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
