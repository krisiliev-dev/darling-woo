# ---------- HTTPS: darlinghome.bg — THE live storefront ----------
# Enabled at cutover step C2 (rename .disabled → .conf after the cert exists).
# Differences from the staging block, on purpose:
#   - no auth_basic (the password gate retires with staging)
#   - no X-Robots-Tag noindex (this site SHOULD be indexed)
#   - Shopify-era URL map (301s) so old links and search results keep working
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name darlinghome.bg www.darlinghome.bg;

    ssl_certificate     /etc/letsencrypt/live/darlinghome.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darlinghome.bg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Canonical host: www → apex, everything else continues below.
    if ($host = www.darlinghome.bg) { return 301 https://darlinghome.bg$request_uri; }

    root /var/www/html;
    index index.php;
    client_max_body_size 64M;

    access_log /var/log/nginx-host/access.log;
    access_log /dev/stdout;
    error_log  /var/log/nginx-host/error.log warn;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Peer-box liveness document — moved here from the staging block, so the
    # staging name can be fully retired. Unauthenticated by design (carries
    # nothing secret; a shared credential on two boxes would be its own risk).
    location = /peer-health {
        limit_req zone=peerhealth burst=5 nodelay;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /var/www/public/peer-health.json;
    }

    # ---- Shopify-era URLs (301, permanent — structure changed with the move) ----
    location = /collections { return 301 /shop/; }
    location = /collections/all { return 301 /shop/; }
    location ~ ^/collections/([^/]+)/?$ { return 301 /product-category/$1/; }
    location ~ ^/products/([^/]+)/?$ { return 301 /product/$1/; }
    location ~ ^/pages/([^/]+)/?$ { return 301 /$1/; }
    location = /cart { return 301 /cart/; }
    # ---------------------------------------------------------------------------

    location / { try_files $uri $uri/ /index.php?$args; }

    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }

    if ($arg_author) { return 403; }

    # ---- page cache bypass (identical rules to staging — same reasoning) ----
    set $skip_cache 0;
    if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "^/(cart|checkout|my-account|wp-admin|wp-json)") { set $skip_cache 1; }
    if ($http_cookie ~* "wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") { set $skip_cache 1; }
    # -------------------------------------------------------------------------

    location ~ \.php$ {
        fastcgi_cache darling;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache     $skip_cache;
        fastcgi_cache_valid  200 301 302 60s;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        add_header X-Darling-Cache $upstream_cache_status always;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d; access_log off; try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
    location = /xmlrpc.php { deny all; }
}
