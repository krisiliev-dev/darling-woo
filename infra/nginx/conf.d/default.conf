# Payment callbacks must reach the site even though staging is password-gated.
# Without this they 401, and both gateways fail SILENTLY when they do — the card
# is charged at the provider and the order sits in pending forever. That is
# exactly how the Shopify webhook secret bug hid.
#
# Matched on $request_uri, and that detail is load-bearing twice over:
#
#  1. It survives nginx's INTERNAL REDIRECT. `/?wc-api=...` is rewritten to
#     /index.php, which re-enters `location ~ \.php$` and re-runs the access
#     phase — so an exemption keyed on $arg_wc_api, or scoped to `location = /`,
#     is silently undone by the rewrite. $request_uri keeps the original line.
#  2. It anchors the PATH. Keying on the query alone would exempt any URL
#     carrying ?wc-api=wc_stripe — /shop/?wc-api=wc_stripe would have served the
#     whole staging site unauthenticated. The `^/\?` anchor means only the root,
#     which is the only place either gateway ever posts.
#
# Safe because neither endpoint trusts the caller: Stripe verifies its webhook
# HMAC, and BORICA's response is RSA-verified against their certificate with the
# amount re-checked against the order total. Basic auth was never what protected
# them — it only ever kept staging out of Google.
map $request_uri $darling_auth_realm {
    default                          "Darling — staging";
    "~^/\?wc-api=wc_stripe(&|$)"      off;
    "~^/\?wc-api=darling_borica(&|$)" off;
}

# ---------- HTTP: ACME + redirect ----------
server {
    listen 80;
    listen [::]:80;
    # mail.darlinghome.bg is here ONLY so certbot's HTTP-01 challenge can be
    # served for the mail server's certificate; there is no site on that name.
    server_name staging.darlinghome.bg darlinghome.bg www.darlinghome.bg mail.darlinghome.bg;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.darlinghome.bg;

    ssl_certificate     /etc/letsencrypt/live/staging.darlinghome.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.darlinghome.bg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.php;
    client_max_body_size 64M;

    # Log to BOTH: stdout keeps `docker compose logs nginx` useful, the file gives
    # fail2ban something to read. Mounted at /var/log/nginx-host rather than
    # /var/log/nginx, because mounting over the latter replaces the image's
    # stdout/stderr symlinks and silences container logging entirely.
    access_log /var/log/nginx-host/access.log;
    access_log /dev/stdout;
    # nginx logs every rate-limit rejection to the ERROR log ("limiting requests,
    # excess: ... client: <ip>"), which is what fail2ban's shipped
    # nginx-limit-req filter reads. The access log alone is not enough.
    error_log  /var/log/nginx-host/error.log warn;
    error_log  /dev/stderr warn;

    # staging must never be indexed. Removed at cutover.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gate the whole staging site, except the two payment callbacks (see map above)
    auth_basic $darling_auth_realm;
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # ...but ACME must stay open, or renewal breaks
    location /.well-known/acme-challenge/ { auth_basic off; root /var/www/certbot; }

    # Narrow health document for the peer box. Unauthenticated by design: it
    # carries nothing secret, and requiring a credential to read "is this box
    # alive" would mean storing and rotating a shared secret on two machines.
    location = /peer-health {
        auth_basic off;
        limit_req zone=peerhealth burst=5 nodelay;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /var/www/public/peer-health.json;
    }

    location / { try_files $uri $uri/ /index.php?$args; }

    # Throttle login attempts before they reach PHP. burst=5 so a human getting
    # their password wrong a few times is unaffected, while a credential-stuffing
    # run is slowed to uselessness. Returns 429, which fail2ban then bans on.
    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }

    # Author-enumeration probe: /?author=1 redirects to /author/<username>/ and
    # hands an attacker half the credential for free.
    if ($arg_author) { return 403; }

    # ---- page cache bypass ----------------------------------------------
    # The failure that matters is serving one customer's cart, address or order
    # to another. So this errs hard towards NOT caching: every condition below
    # disables the cache, and they are evaluated for every request.
    set $skip_cache 0;

    # Anything that isn't a plain GET is state-changing by definition.
    if ($request_method !~ ^(GET|HEAD)$) { set $skip_cache 1; }

    # Any query string at all — add-to-cart, filters, search, wc-api callbacks.
    # Broad on purpose: a missed cacheable page costs 300ms, a wrongly cached
    # one costs a customer's data.
    if ($query_string != "") { set $skip_cache 1; }

    # Pages that are inherently per-customer.
    if ($request_uri ~* "^/(cart|checkout|my-account|wp-admin|wp-json)") { set $skip_cache 1; }

    # Any cookie that indicates a session, a cart, or a logged-in user. The
    # WooCommerce ones appear the moment something is added to a basket, so a
    # shopper stops being served cached pages from that point on.
    if ($http_cookie ~* "wordpress_logged_in|wp-postpass|comment_author|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") { set $skip_cache 1; }
    # ---------------------------------------------------------------------

    location ~ \.php$ {
        fastcgi_cache darling;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache     $skip_cache;
        fastcgi_cache_valid  200 301 302 60s;
        # Serve a stale page rather than an error if PHP is down or slow, and let
        # one request refresh it while others read the old copy.
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        # NOTE: nginx does not cache responses carrying Set-Cookie, and we rely on
        # that as the backstop — do NOT add Set-Cookie to fastcgi_ignore_headers.
        add_header X-Darling-Cache $upstream_cache_status always;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d; access_log off; try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
    location = /xmlrpc.php { deny all; }
}

# ---------- Webmail: https://mail.darlinghome.bg ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.darlinghome.bg;

    ssl_certificate     /etc/letsencrypt/live/mail.darlinghome.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.darlinghome.bg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Deliberately NOT behind the staging basic-auth gate: this is a real service
    # with its own login, and it must keep working after the shop goes live. The
    # mail server's fail2ban covers repeated IMAP auth failures behind it.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://roundcube:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
