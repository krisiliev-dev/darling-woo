# Final post-cutover config: staging is GONE (name retired, record deleted by
# Kris). HTTP answers for the live names + mail (ACME); webmail unchanged.

# ---------- HTTP: ACME + redirect ----------
server {
    listen 80;
    listen [::]:80;
    # mail.darlinghome.bg is here ONLY so certbot's HTTP-01 challenge can be
    # served for the mail server's certificate; there is no site on that name.
    server_name darlinghome.bg www.darlinghome.bg mail.darlinghome.bg;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- Webmail: https://mail.darlinghome.bg ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.darlinghome.bg;

    ssl_certificate     /etc/letsencrypt/live/mail.darlinghome.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.darlinghome.bg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Deliberately open: real service with its own login; the mail server's
    # fail2ban covers repeated IMAP auth failures behind it.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        proxy_pass http://roundcube:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
