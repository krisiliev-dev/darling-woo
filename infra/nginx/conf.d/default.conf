# Payment callbacks must reach the site even though staging is password-gated.
# Stripe and BORICA post to /?wc-api=..., which is a QUERY parameter, so a
# `location` block cannot match it — nginx routes on path only. Feeding a mapped
# variable to auth_basic is the way to make the exemption depend on the query.
#
# Safe because neither endpoint trusts the caller: Stripe verifies its webhook
# HMAC and BORICA's response is RSA-verified against their certificate, with the
# amount re-checked against the order. Basic auth was never what protected them.
#
# Without this the callbacks 401 and both gateways fail SILENTLY — the payment
# succeeds at the provider and the order never leaves pending. Exactly how the
# Shopify webhook secret bug hid.
map $arg_wc_api $darling_auth_realm {
    default        "Darling — staging";
    "wc_stripe"     off;
    "darling_borica" off;
}

# ---------- HTTP: ACME + redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name staging.darlinghome.bg darlinghome.bg www.darlinghome.bg;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.darlinghome.bg;

    ssl_certificate     /etc/letsencrypt/live/staging.darlinghome.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.darlinghome.bg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.php;
    client_max_body_size 64M;

    # staging must never be indexed. Removed at cutover.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gate the whole staging site... except payment callbacks (see map above)
    auth_basic $darling_auth_realm;
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # ...but ACME must stay open, or renewal breaks
    location /.well-known/acme-challenge/ { auth_basic off; root /var/www/certbot; }

    # Narrow health document for the peer box. Unauthenticated by design: it
    # carries nothing secret, and requiring a credential to read "is this box
    # alive" would mean storing and rotating a shared secret on two machines.
    location = /peer-health {
        auth_basic off;
        limit_req zone=peerhealth burst=5 nodelay;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /var/www/public/peer-health.json;
    }

    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d; access_log off; try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
    location = /xmlrpc.php { deny all; }
}
