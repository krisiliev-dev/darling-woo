# TEXT COMPRESSION. It was never on.
#
# *** MEASURED 2026-08-10, FROM A REAL CLIENT, NOT THROUGH A PROXY. ***
#
#   GET /wp-content/themes/darling/darling.build.css
#   content-encoding:  (none)
#   content-length:    629995
#
# 630 KB of stylesheet, uncompressed, on every page load, to an audience that is
# mostly mid-range Android phones on Bulgarian mobile networks. The HTML document
# was uncompressed too, and so was every WooCommerce sheet beside ours.
#
# The cause is not a mistake anybody made. The stock nginx image ships
# /etc/nginx/nginx.conf with line 29 reading
#
#     #gzip  on;
#
# commented out, and nothing in this repo ever turned it on. It has been that way
# for as long as the site has existed, and no page-speed number anybody has looked
# at would have named it: the site is FAST on a laptop, and 630 KB is invisible
# there.
#
# What it costs, measured on the built stylesheet:
#
#     raw                       614.9 KB
#     gzip -6 (this file)       176.3 KB
#     gzip after comment strip   ~45 KB     (see scripts/build-css.js)
#
# NO BROTLI, AND NOT BY CHOICE: `nginx -V` on the box reports
# --with-http_gzip_static_module and no brotli module at all, so br would mean a
# different image. gzip_static is here so that if the build ever emits a .gz
# beside a file, nginx serves that instead of compressing on the fly - a level-9
# precompressed file, at no CPU cost per request.
gzip              on;
gzip_vary         on;          # Vary: Accept-Encoding, or a proxy caches the wrong one
gzip_proxied      any;         # this sits behind nothing today, but it may not always
gzip_comp_level   6;           # 6 is the knee; 9 costs measurably more CPU for ~2% less
gzip_min_length   1024;        # below ~1 KB the header overhead is most of the payload
gzip_static       on;

# Deliberately NOT a wildcard. Compressing an already-compressed format - webp,
# woff2, jpg, png, zip - burns CPU to make the file slightly larger, and
# compressing an unknown type is how a proxy corrupts a download. text/html is
# always compressed by nginx and cannot be listed here.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;