# Rate-limit the one unauthenticated endpoint. It is cheap to serve, but an
# open endpoint should never be an amplifier.
limit_req_zone $binary_remote_addr zone=peerhealth:1m rate=30r/m;

# Brute-force protection for the WordPress login.
#
# Deliberately NOT applied to /wp-json/: the block checkout drives the Store API
# hard on every address keystroke and shipping recalculation, and rate-limiting
# that would break checkout for real customers under exactly the conditions we
# want it to work. Login is the endpoint worth throttling — it is low-volume for
# humans and high-volume for attackers.
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=15r/m;

# Full-page micro-cache for ANONYMOUS visitors.
#
# Measured need: uncached WooCommerce serves ~15 req/s on this box while static
# files serve 3,224 — and that ~15 is what a launch-day spike would hit.
#
# 60 seconds, deliberately short. Long enough that a burst of traffic on one
# product is served from memory; short enough that a price or stock change is
# never stale for more than a minute. Stock accuracy matters more than cache hit
# rate for a shop that can oversell.
fastcgi_cache_path /var/cache/nginx/darling levels=1:2 keys_zone=darling:100m
                   inactive=10m max_size=512m;
fastcgi_cache_key "$scheme$request_method$host$request_uri";
