<!-- Copied verbatim from WooCommerce order-confirmation.html with ONE line added, the
     same fix and the same reasoning as page-checkout.html.
     Measured on the live page: /checkout/order-received/ returns 200 and renders this
     template even with no valid order key, and it had ZERO h1 elements. That is the
     page a customer lands on immediately after paying, so its heading tree had no root
     and a screen reader never announced it.
     Screen reader only, as on checkout: WooCommerce omits the title here deliberately
     and the visual design is not the defect. Unlike checkout, this template uses the
     THEME header and footer, and those are left exactly as shipped. -->
