<!--
	The required fallback. WordPress uses this for anything with no more
	specific template, so it has to be the generic list rather than anything
	clever.
	
	AUTHORED 2026-08-10, when the theme stopped being a child of Twenty Twenty-Five.
	
	Until today this file did not exist and WordPress fell through to the parent
	theme for it. That was not free: being a child means WordPress MERGES the two
	theme.json files and prints the result as global-styles-inline-css, UNLAYERED -
	so the parent owned our body weight (300), our tracking (-0.1px), every heading
	size, and `a:where(:not(.wp-element-button)){color:currentColor}`, which made the
	seasonal band call to action cream on cream. Unlayered beats every cascade layer,
	and almost all of src/ is layered, so none of it could be argued with from CSS.
	
	The owner: "The single source of truth that should be available is everything we
	have been doing in src/, so anything else should be removed and deleted/archived
	so nothing touches it and can never revert back to it."
	
	*** DO NOT SET A CONSTRAINED LAYOUT ON post-content OR ON main. *** B1 measured
	what that costs: WordPress emits the constrained rule at RENDER time, capping
	children at theme.json contentSize, and it rendered the search grid at 374px
	instead of 714px. No stylesheet grep can find it. The frame is d-shell, in the
	markup, where a human put it.
-->
