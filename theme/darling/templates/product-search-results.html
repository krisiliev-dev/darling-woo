	     untranslated on the web despite bg_BG packs (translates fine via wp-cli —
	     loader quirk, logged in the status doc), and Shopify's h1 carries no term
	     anyway — the results-count line below shows it. -->

	<!-- The search block pre-fills the current query (get_search_query), which a
	     static form cannot. Submitting it drops post_type=product, so results may
	     include pages — the Shopify search behaves the same way (products, pages
	     and articles), so mixed results here are parity, not a defect. -->
