<!-- wp:group {"tagName":"main","className":"d-archive d-shell","layout":{"type":"default"}} -->
<main class="wp-block-group d-archive d-shell">

	<!-- Red category banner — the live site's .darling-cat-banner component from
	     the ported darling.css: title + term description + the shared „идваме с
	     пълни ръце" line, photo on the right (per-term image via body-class CSS;
	     term descriptions live as product_cat term data, set from the live site).
	     Breadcrumbs deliberately absent, as on the live site. -->
	<!-- wp:group {"className":"d-catbanner","layout":{"type":"default"}} -->
	<div class="wp-block-group d-catbanner">
		<!-- wp:group {"className":"d-catbanner__text","layout":{"type":"default"}} -->
		<div class="wp-block-group d-catbanner__text">
			<!-- wp:query-title {"type":"archive","level":1,"showPrefix":false} /-->
			<!-- wp:term-description {"className":"d-catbanner__desc"} /-->
			<!-- wp:html -->
			<p class="d-catbanner__coming"><em>Още 4 590 неща пътуват от магазина в Свищов, darling — идваме с пълни ръце.</em></p>
			<!-- /wp:html -->
		</div>
		<!-- /wp:group -->
		<!-- wp:html -->
		<div class="d-catbanner__img" aria-hidden="true"></div>
		<!-- /wp:html -->
	</div>
	<!-- /wp:group -->

	<!-- main declares its OWN contentSize above (90rem). Without it the group
	     inherits theme.json contentSize — 43rem, a PROSE measure set in slice 3 —
	     and the whole archive, sidebar included, rendered 688px wide inside a
	     1344px main, which is why one product card sat marooned. `alignwide`
	     was the first attempt and was wrong: WP gives aligned children negative
	     margins to span the root padding, so the page overflowed by exactly the
	     gutter on every phone. Declaring the measure is the honest fix. -->
	<!-- wp:columns {"className":"d-archive__body"} -->
	<div class="wp-block-columns d-archive__body">

		<!-- Filters in a sidebar rather than a drawer: on a category page the
		     customer is browsing, and hiding the controls behind a tap costs more
		     than the space they take. On narrow screens it stacks above the grid. -->
		<!-- wp:column {"width":"250px","className":"d-archive__side"} -->
		<div class="wp-block-column d-archive__side" style="flex-basis:250px">
			<!-- wp:heading {"level":2,"className":"","fontSize":"medium"} -->
			<h2 class="wp-block-heading has-medium-font-size">Филтри</h2>
			<!-- /wp:heading -->
			<!-- wp:woocommerce/product-filters -->
			<div class="wp-block-woocommerce-product-filters">
				<!-- wp:woocommerce/product-filter-stock-status /-->
				<!-- wp:woocommerce/product-filter-price /-->
			</div>
			<!-- /wp:woocommerce/product-filters -->
		</div>
		<!-- /wp:column -->

		<!-- wp:column {"className":""} -->
		<div class="wp-block-column">

			<!-- wp:group {"className":"d-toolbar","layout":{"type":"flex","justifyContent":"space-between"}} -->
			<div class="wp-block-group d-toolbar">
				<!-- wp:woocommerce/product-results-count /-->
				<!-- wp:group {"className":"d-toolbar__spacer","layout":{"type":"flex"}} -->
				<div class="wp-block-group d-toolbar__spacer">
					<!-- wp:woocommerce/catalog-sorting /-->
					<!-- wp:html -->
					<div class="d-view" role="group" aria-label="Изглед">
						<button type="button" class="is-active" aria-pressed="true" data-darling-view="grid" aria-label="Мрежа">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
						</button>
						<button type="button" aria-pressed="false" data-darling-view="list" aria-label="Списък">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="16" height="3" rx="1.5"/><rect x="4" y="10.5" width="16" height="3" rx="1.5"/><rect x="4" y="16" width="16" height="3" rx="1.5"/></svg>
						</button>
					</div>
					<script>
					(function () {
						// The grid renders AFTER this bar in document order, so it
						// must be looked up at click time, not at parse time.
						document.querySelectorAll('[data-darling-view]').forEach(function (b) {
							b.addEventListener('click', function () {
								var g = document.querySelector('.darling-archive .darling-grid');
								if (!g) { return; }
								g.classList.toggle('darling-grid--list', b.dataset.darlingView === 'list');
								document.querySelectorAll('[data-darling-view]').forEach(function (x) {
								// BOTH: .is-active is what the stylesheet reads, aria-pressed is what a
								// screen reader reads. Shipping only the class meant the control had
								// no on state for either of them - the CSS was written against the
								// gallery specimen, which uses aria-pressed.
								x.classList.toggle('is-active', x === b);
								x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
							});
							});
						});
					})();
					</script>
					<!-- /wp:html -->
				</div>
				<!-- /wp:group -->
			</div>
			<!-- /wp:group -->

			<!-- wp:query {"query":{"perPage":24,"postType":"product","inherit":true},"className":"d-grid"} -->
			<div class="wp-block-query d-grid">
				<!-- wp:post-template -->
					<!-- wp:woocommerce/product-image {"imageSizing":"thumbnail"} /-->
					<!-- wp:post-title {"level":2,"isLink":true} /-->
					<!-- wp:woocommerce/product-price /-->
					<!-- wp:woocommerce/product-button /-->
				<!-- /wp:post-template -->

				<!-- wp:query-pagination {"className":"d-pagination"} -->
					<!-- wp:query-pagination-previous /-->
					<!-- wp:query-pagination-numbers /-->
					<!-- wp:query-pagination-next /-->
				<!-- /wp:query-pagination -->

				<!-- wp:query-no-results -->
				<!-- wp:html -->
				<div class="d-empty">
					<svg class="d-empty__bow" viewBox="0 0 24 12" fill="currentColor" aria-hidden="true"><path d="M12 6 L3.2 1.4 C1.8.7 1.8 11.3 3.2 10.6 Z M12 6 l8.8-4.6 c1.4-.7 1.4 9.9 0 9.2 Z"/><circle cx="12" cy="6" r="2.4"/></svg>
					<p class="d-empty__title">Тук още е празно, darling.</p>
					<p class="d-empty__sub">Тази категория тепърва се пълни — още 4&nbsp;590 неща пътуват от магазина в Свищов. Върнете се скоро или разгледайте останалото.</p>
					<a class="d-btn" href="/shop/">Разгледай всички продукти</a>
				</div>
				<!-- /wp:html -->
				<!-- /wp:query-no-results -->
			</div>
			<!-- /wp:query -->

		</div>
		<!-- /wp:column -->
	</div>
	<!-- /wp:columns -->

</main>
<!-- /wp:group -->
