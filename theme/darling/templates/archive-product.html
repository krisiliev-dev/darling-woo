<!-- wp:template-part {"slug":"header","tagName":"header"} /-->

<!-- wp:group {"tagName":"main","className":"darling-archive","layout":{"type":"constrained","contentSize":"90rem"}} -->
<main class="wp-block-group darling-archive">

	<!-- Red category banner — the live site's .darling-cat-banner component from
	     the ported darling.css: title + term description + the shared „идваме с
	     пълни ръце" line, photo on the right (per-term image via body-class CSS;
	     term descriptions live as product_cat term data, set from the live site).
	     Breadcrumbs deliberately absent, as on the live site. -->
	<!-- wp:group {"className":"darling-cat-banner darling-cat-banner--woo","layout":{"type":"default"}} -->
	<div class="wp-block-group darling-cat-banner darling-cat-banner--woo">
		<!-- wp:group {"className":"dcb-text","layout":{"type":"default"}} -->
		<div class="wp-block-group dcb-text">
			<!-- wp:query-title {"type":"archive","level":1,"showPrefix":false} /-->
			<!-- wp:term-description {"className":"dcb-desc"} /-->
			<!-- wp:html -->
			<p class="dcb-coming"><em>Още 4 590 неща пътуват от магазина в Свищов, darling — идваме с пълни ръце.</em></p>
			<!-- /wp:html -->
		</div>
		<!-- /wp:group -->
		<!-- wp:html -->
		<div class="dcb-img" aria-hidden="true"></div>
		<!-- /wp:html -->
	</div>
	<!-- /wp:group -->

	<!-- main declares its OWN contentSize above (90rem). Without it the group
	     inherits theme.json contentSize — 43rem, a PROSE measure set in slice 3 —
	     and the whole archive, sidebar included, rendered 688px wide inside a
	     1344px main, which is why one product card sat marooned. `alignwide`
	     was the first attempt and was wrong: WP gives aligned children negative
	     margins to span the root padding, so the page overflowed by exactly the
	     gutter on every phone. Declaring the measure is the honest fix. -->
	<!-- wp:columns {"className":"darling-archive__body"} -->
	<div class="wp-block-columns darling-archive__body">

		<!-- Filters in a sidebar rather than a drawer: on a category page the
		     customer is browsing, and hiding the controls behind a tap costs more
		     than the space they take. On narrow screens it stacks above the grid. -->
		<!-- wp:column {"width":"250px","className":"darling-archive__side"} -->
		<div class="wp-block-column darling-archive__side" style="flex-basis:250px">
			<!-- wp:heading {"level":2,"className":"darling-archive__filters-title","fontSize":"medium"} -->
			<h2 class="wp-block-heading darling-archive__filters-title has-medium-font-size">Филтри</h2>
			<!-- /wp:heading -->
			<!-- wp:woocommerce/product-filters -->
			<div class="wp-block-woocommerce-product-filters">
				<!-- wp:woocommerce/product-filter-stock-status /-->
				<!-- wp:woocommerce/product-filter-price /-->
			</div>
			<!-- /wp:woocommerce/product-filters -->
		</div>
		<!-- /wp:column -->

		<!-- wp:column {"className":"darling-archive__main"} -->
		<div class="wp-block-column darling-archive__main">

			<!-- wp:group {"className":"darling-archive__bar","layout":{"type":"flex","justifyContent":"space-between"}} -->
			<div class="wp-block-group darling-archive__bar">
				<!-- wp:woocommerce/product-results-count /-->
				<!-- wp:group {"className":"darling-archive__bar-right","layout":{"type":"flex"}} -->
				<div class="wp-block-group darling-archive__bar-right">
					<!-- wp:woocommerce/catalog-sorting /-->
					<!-- wp:html -->
					<div class="darling-view-toggle" role="group" aria-label="Изглед">
						<button type="button" class="is-active" data-darling-view="grid" aria-label="Мрежа">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
						</button>
						<button type="button" data-darling-view="list" aria-label="Списък">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="16" height="3" rx="1.5"/><rect x="4" y="10.5" width="16" height="3" rx="1.5"/><rect x="4" y="16" width="16" height="3" rx="1.5"/></svg>
						</button>
					</div>
					<script>
					(function () {
						// The grid renders AFTER this bar in document order, so it
						// must be looked up at click time, not at parse time.
						document.querySelectorAll('[data-darling-view]').forEach(function (b) {
							b.addEventListener('click', function () {
								var g = document.querySelector('.darling-archive .darling-grid');
								if (!g) { return; }
								g.classList.toggle('darling-grid--list', b.dataset.darlingView === 'list');
								document.querySelectorAll('[data-darling-view]').forEach(function (x) { x.classList.toggle('is-active', x === b); });
							});
						});
					})();
					</script>
					<!-- /wp:html -->
				</div>
				<!-- /wp:group -->
			</div>
			<!-- /wp:group -->

			<!-- wp:query {"query":{"perPage":24,"postType":"product","inherit":true},"className":"darling-grid"} -->
			<div class="wp-block-query darling-grid">
				<!-- wp:post-template -->
					<!-- wp:woocommerce/product-image {"imageSizing":"thumbnail"} /-->
					<!-- wp:post-title {"level":2,"isLink":true} /-->
					<!-- wp:woocommerce/product-price /-->
					<!-- wp:woocommerce/product-button /-->
				<!-- /wp:post-template -->

				<!-- wp:query-pagination {"className":"darling-pagination"} -->
					<!-- wp:query-pagination-previous /-->
					<!-- wp:query-pagination-numbers /-->
					<!-- wp:query-pagination-next /-->
				<!-- /wp:query-pagination -->

				<!-- wp:query-no-results -->
					<!-- wp:paragraph {"className":"darling-empty"} -->
					<p class="darling-empty">В тази категория още няма продукти. Разгледайте
					<a href="/shop/">всички продукти</a> или се върнете скоро.</p>
					<!-- /wp:paragraph -->
				<!-- /wp:query-no-results -->
			</div>
			<!-- /wp:query -->

		</div>
		<!-- /wp:column -->
	</div>
	<!-- /wp:columns -->

</main>
<!-- /wp:group -->
