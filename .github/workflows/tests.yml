name: Tests

# darling-woo had no test job at all. The only workflow here was the infra deploy, and it fires
# only on infra/**, so the plugin's PHP - including the BORICA protocol, the code that decides
# whether a card payment was actually paid - was never checked by anything except a human
# remembering to run it. A gate nobody runs automatically is not a gate.
#
# Only what can run WITHOUT the site is here: the protocol vector gate (no WordPress, no network,
# no credentials) and a syntax lint. The Playwright specs in tests/ are deliberately NOT here -
# they drive the real staging site and need STAGING_PASS and a live box, so on a runner they would
# fail for reasons that have nothing to do with the commit, and a permanently red gate is ignored.
#
# NOTE on what green means. infra/deploy.sh DOES ship plugin/ and theme/ to the box, and it runs
# its own php -l over the plugin first - but the Deploy infra workflow only fires on push for
# infra/**, so a commit that changes only the plugin does not deploy itself; somebody dispatches
# it. Green here therefore means the commit is sound, NOT that the box is running it. (An earlier
# version of this comment said the plugin was deployed by hand via deploy_to_box.sh. That is the
# panel lane's script, not this one - corrected 2026-08-06 after reading deploy.sh.)

# No paths filter. There was one - plugin/**, theme/**, tests/** - and two pushes that touched
# those paths produced no run at all, while an on-demand run of the same file worked and the
# admin-panel repo's unfiltered push trigger fired normally in the same minutes. The filter was
# the only part of this that could not be verified from the outside, so it is gone. The job
# takes 14 seconds; asking "did this commit break the payment protocol" on every push is worth
# more than the seconds saved, and a filter that silently skips is worse than no filter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 8.3 because that is what the box runs (wordpress:php8.3-fpm, infra/docker-compose.yml).
      # Linting on whatever PHP the runner defaults to proves the code parses somewhere, not that
      # it parses in production.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring, json
          coverage: none

      - name: Syntax lint (plugin, theme, tests)
        run: |
          n=$(find plugin theme tests -name '*.php' -type f | wc -l)
          # A find that matched nothing would make this step pass while checking nothing.
          if [ "$n" -eq 0 ]; then
            echo "::error::no PHP files found - the lint would have passed while checking nothing"
            exit 1
          fi
          find plugin theme tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          echo "linted $n PHP files"

      # The one that protects money: assertions over the same borica-vectors.json the Python core
      # is gated with, five of them carrying real signatures from BORICA's test terminal V1800001.
      # Exit 2 = the protocol class was not found; exit 1 = an assertion failed. Neither deploys.
      - name: BORICA protocol vector gate
        run: php tests/borica-protocol-gate.php

  generated:
    # *** THE GENERATED FILES ARE SHIPPED, NOT BUILT ON THE BOX. ***
    # infra/deploy.sh rsyncs theme/darling/ verbatim, and the box has no node -
    # checked, `command -v node` is empty there. So what the site serves is
    # whatever was committed, and the only question worth asking automatically is
    # whether the committed version is the one the sources produce.
    #
    # This replaces the plan in claude/CUTOVER_GATE_20260808.md to run the build
    # on the box from cron. That would have been worse: it rebuilds in place, so
    # the box would serve a stylesheet that exists in no commit and cannot be
    # reviewed after the fact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate, and diff against what was committed
        run: |
          # The gallery is NOT in this list, and that is a real gap rather than a
          # tidy one: gen-gallery.py takes three to six minutes. It is a review
          # document, not something the storefront serves, so it is excluded -
          # said out loud, because a silent exclusion reads as coverage.
          node scripts/gen-category-banners.js
          node scripts/build-css.js
          node scripts/gen-theme-json.js
          node scripts/resolve-tokens.js
          node scripts/gen-stripe-appearance.js
          if ! git diff --quiet -- theme/darling/darling.build.css \
                 theme/darling/theme.json theme/darling/tokens.resolved.json \
                 theme/darling/assets/stripe-appearance.js \
                 theme/darling/src/generated/; then
            echo "::error::a generated file in the repo is not what its sources produce."
            echo "The box serves the COMMITTED copy - infra/deploy.sh rsyncs theme/ verbatim -"
            echo "so this means the live stylesheet would be a version nobody reviewed."
            echo "Run: node scripts/build.js"
            git --no-pager diff --stat -- theme/darling
            exit 1
          fi
          echo "every generated file matches its sources (gallery excluded, see above)"

      - name: Does the stylesheet answer the markup we ship?
        run: python scripts/markupgate.py

      - name: One bow
        run: node scripts/bowgate.js

      - name: One accessibility class
        run: node scripts/a11ygate.js
